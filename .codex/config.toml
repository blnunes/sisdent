[mcp_servers.quality-gate]
command = "sh"
args = ["-c", "node \"$(git rev-parse --show-toplevel)/.codex/mcp/quality-gate.mjs\""]
required = true
tool_timeout_sec = 300
default_tools_approval_mode = "approve"

[mcp_servers.formatting-gate]
command = "sh"
args = ["-c", "node \"$(git rev-parse --show-toplevel)/.codex/mcp/formatting-gate.mjs\""]
required = true
tool_timeout_sec = 120
default_tools_approval_mode = "approve"
