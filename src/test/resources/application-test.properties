# Loaded only by Spring integration tests. It keeps test data isolated from the
# development in-memory database while inheriting the application's defaults.
# The shared test context uses one isolated in-memory database and runs Flyway once.
spring.datasource.url=jdbc:h2:mem:sisdent-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.h2.console.enabled=false
spring.main.banner-mode=off
