spring.application.name=sisdent
debug=false
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:sisdent;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

logging.level.br.com.itbn.sisdent=INFO
logging.level.root=INFO

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

sisdent.security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production-2026}
sisdent.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
sisdent.bootstrap-admin.identification-type=${BOOTSTRAP_ADMIN_IDENTIFICATION_TYPE:NATIONAL_ID}
sisdent.bootstrap-admin.identification-number=${BOOTSTRAP_ADMIN_IDENTIFICATION_NUMBER:ADMIN-001}
sisdent.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:change-me-now}
