spring.application.name=sisdent
debug=false
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:sisdent;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

logging.level.br.com.itbn.sisdent=INFO
logging.level.root=INFO

sisdent.security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production-2026}
sisdent.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
sisdent.email-verification.challenge-lifetime-seconds=${EMAIL_VERIFICATION_LIFETIME_SECONDS:900}
sisdent.email-verification.resend-cooldown-seconds=${EMAIL_VERIFICATION_COOLDOWN_SECONDS:60}
sisdent.email-verification.recent-window-seconds=${EMAIL_VERIFICATION_RECENT_WINDOW_SECONDS:86400}
sisdent.email-verification.max-recent-challenges=${EMAIL_VERIFICATION_MAX_RECENT_CHALLENGES:5}
sisdent.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin}
sisdent.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@sisdent.local}
sisdent.avatar.storage-directory=${SISDENT_AVATAR_STORAGE_DIRECTORY:${java.io.tmpdir}/sisdent/avatars}
spring.servlet.multipart.max-file-size=5MB
# A multipart envelope adds boundary and headers; the processor still enforces a 5 MiB file limit.
spring.servlet.multipart.max-request-size=6MB
