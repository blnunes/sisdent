<div class="dialog-heading"><span class="dialog-icon"><mat-icon>admin_panel_settings</mat-icon></span><div><h2 mat-dialog-title>Gerir permissões</h2><p>{{ user.identificationNumber }} · {{ user.role }}</p></div></div>
<mat-dialog-content><p class="helper">Escolha as ações permitidas. O perfil define o limite máximo de acesso.</p><div class="permission-grid">@for (permission of allPermissions; track permission) {<mat-checkbox [checked]="selected().has(permission)" [disabled]="isAdmin" (change)="toggle(permission, $event.checked)"><span class="permission-name">{{ 'PERMISSIONS.' + permission | translate }}</span><small>{{ descriptions[permission] }}</small></mat-checkbox>}</div></mat-dialog-content>
<mat-dialog-actions align="end"><button mat-button mat-dialog-close>Cancelar</button><button mat-flat-button class="primary-action" [disabled]="isAdmin" (click)="save()">Guardar permissões</button></mat-dialog-actions>
