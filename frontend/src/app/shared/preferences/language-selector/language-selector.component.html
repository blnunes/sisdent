<mat-icon aria-hidden="true">language</mat-icon>
<mat-select
  class="language-selector"
  panelClass="language-panel"
  [value]="language.current()"
  (selectionChange)="language.set($event.value)"
  [attr.aria-label]="'LANGUAGE.SELECT' | translate"
>
  @for (option of languageOptions; track option.value) { <mat-option [value]="option.value">{{ option.label }}</mat-option> }
</mat-select>
